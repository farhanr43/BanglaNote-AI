<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BanglaNote AI</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <!-- Tailwind CSS (CDN is fine for simple Vercel deployment) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <meta name="google-site-verification" content="2lwMIro9g5fdoVuPAhyXiYAnn7IvnMocHXJBBdOReMI" />
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              teal: {
                50: '#f0fdfa',
                100: '#ccfbf1',
                200: '#99f6e4',
                300: '#5eead4',
                400: '#2dd4bf',
                500: '#14b8a6',
                600: '#0d9488',
                700: '#0f766e',
                800: '#115e59',
                900: '#134e4a',
              }
            },
            fontFamily: {
              sans: ['Inter', 'ui-sans-serif', 'system-ui'],
              bengali: ['"Noto Sans Bengali"', 'sans-serif'],
            },
          },
        },
      }
    </script>
    <!-- Google Fonts: Inter and Noto Sans Bengali -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Bengali:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- SutonnyMJ for Bangla export (and preview) + Times New Roman is system font -->
    <link href="https://db.onlinewebfonts.com/c/745d8457da8dec2e3477d0d4da431299?family=SutonnyMJ" rel="stylesheet">
    <style>
      html {
        scroll-behavior: smooth;
      }
      body {
        font-family: 'Inter', sans-serif;
      }
      .font-bengali {
        font-family: 'Noto Sans Bengali', sans-serif;
      }

      /* ---------- Animations ---------- */
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(16px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      @keyframes scaleIn {
        from { opacity: 0; transform: scale(0.96) translateY(8px); }
        to   { opacity: 1; transform: scale(1) translateY(0); }
      }
      @keyframes gradientShift {
        0%, 100% { background-position: 0% 50%; }
        50%      { background-position: 100% 50%; }
      }
      @keyframes floaty {
        0%, 100% { transform: translateY(0); }
        50%      { transform: translateY(-14px); }
      }
      @keyframes glowPulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(13, 148, 136, 0.28); }
        50%      { box-shadow: 0 0 0 12px rgba(13, 148, 136, 0); }
      }
      @keyframes shimmer {
        0%   { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }

      .animate-fade-in-up { animation: fadeInUp 0.6s ease-out both; }
      .animate-fade-in    { animation: fadeIn 0.6s ease-out both; }
      .animate-scale-in   { animation: scaleIn 0.25s ease-out both; }
      .animate-floaty     { animation: floaty 7s ease-in-out infinite; }
      .animate-glow       { animation: glowPulse 2.6s ease-in-out infinite; }
      .animate-gradient-text {
        background-size: 200% 200%;
        animation: gradientShift 6s ease infinite;
      }

      .stagger > * { animation: fadeInUp 0.5s ease-out both; }
      .stagger > *:nth-child(1) { animation-delay: 0.05s; }
      .stagger > *:nth-child(2) { animation-delay: 0.12s; }
      .stagger > *:nth-child(3) { animation-delay: 0.19s; }
      .stagger > *:nth-child(4) { animation-delay: 0.26s; }
      .stagger > *:nth-child(5) { animation-delay: 0.33s; }
      .stagger > *:nth-child(6) { animation-delay: 0.40s; }

      .hover-lift {
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }
      .hover-lift:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 30px -12px rgba(0, 0, 0, 0.25);
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "vite": "https://aistudiocdn.com/vite@^7.2.6",
    "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.1.1",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.39.7"
  }
}
</script>
</head>
  <body class="bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-gray-100 transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
